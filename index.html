<script id="bha-loader-js">
(function(){
  var el = document.getElementById('bha-loader');
  if(!el) return;
  var t0 = Date.now();
  function hide(){
    var wait = Math.max(0, 550 - (Date.now() - t0));
    setTimeout(function(){
      el.classList.add('done');
      setTimeout(function(){ el.remove(); }, 600);
    }, wait);
  }
  if (document.readyState === 'complete') hide();
  else window.addEventListener('load', hide, { once: true });
  setTimeout(hide, 6000);
})();

<!-- bha-music-widget : 2D 黑胶唱片 · 点击播放/暂停 -->
<style id="bha-music-widget-css">
#bha-music{position:fixed;right:22px;bottom:22px;z-index:70;display:flex;flex-direction:column;align-items:flex-end;gap:5px;
  font-family:Arial,"Microsoft YaHei",sans-serif}
.bha-wrap{position:relative;width:76px;height:76px}
#bha-ring{position:absolute;inset:-7px;border-radius:50%;pointer-events:none;z-index:3;
  background:conic-gradient(#ff6841 0 var(--p,0%),transparent var(--p,0%) 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px))}
#bha-disc{position:relative;z-index:2;width:76px;height:76px;padding:0;border:2px solid #c5fa39;border-radius:50%;
  background:#101208;cursor:pointer;box-shadow:3px 3px 0 #0007;transition:transform .16s,box-shadow .16s}
#bha-disc:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #c5fa39}
#bha-disc:focus-visible{outline:3px solid #ff6841;outline-offset:7px}
.bha-plate{position:absolute;inset:4px;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%,#31352a 0 1.5px,#14160f 1.5px 4px);
  display:grid;place-items:center;animation:bha-spin 3.4s linear infinite;animation-play-state:paused}
.bha-label{width:30px;height:30px;border-radius:50%;background:#c5fa39;border:2px solid #111;
  display:grid;place-items:center;position:relative;transition:background .2s}
.bha-ico{width:0;height:0;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent #111;
  margin-left:3px;transition:all .2s}
.bha-pause{display:none;gap:3px}
.bha-pause i{width:3px;height:12px;background:#111;display:block}
#bha-music[data-state=playing] .bha-plate{animation-play-state:running}
#bha-music[data-state=playing] .bha-ico{display:none}
#bha-music[data-state=playing] .bha-pause{display:flex}
#bha-music[data-state=playing] .bha-label{background:#ff6841;box-shadow:0 0 0 2px #c5fa39,0 0 18px #ff684199}
#bha-creditbar{background:#0b0c0a;border-top:1px solid #23271c;color:#79856b;font-family:Arial,"Microsoft YaHei",sans-serif;font-size:9px;letter-spacing:.3px;padding:10px max(4vw,20px) 14px;padding-right:112px}
footer{padding-right:calc(max(4vw,24px) + 104px)!important}
@media (max-width:720px){footer{padding-right:96px!important}}
@keyframes bha-spin{to{transform:rotate(360deg)}}
@media (max-width:720px){
  #bha-music{right:14px;bottom:14px}
  .bha-wrap,#bha-disc{width:64px;height:64px}
  .bha-label{width:26px;height:26px}
  .bha-ico{border-width:6px 0 6px 9px}
  .bha-pause i{height:10px}
  #bha-creditbar{font-size:8px;padding-right:92px;padding-bottom:10px}
}
@media (prefers-reduced-motion:reduce){.bha-plate{animation:none!important}}
</style>
<div id="bha-creditbar">音乐：《雨爱》（司凤版）— 苏南忧郁之神 · 整首 1.25 倍速 · 仅供班级内部欣赏<span class="bha-sign" style="opacity: 0.75;">　·　Dandanyifu 的网站</span></div>
<div id="bha-music" data-state="off">
  <div class="bha-wrap">
    <div id="bha-ring"></div>
    <button id="bha-disc" type="button" aria-pressed="false" aria-label="播放音乐" title="播放音乐">
      <span class="bha-plate">
        <span class="bha-label">
          <span class="bha-ico"></span>
          <span class="bha-pause"><i></i><i></i></span>
        </span>
      </span>
    </button>
  </div>
</div>
<audio id="bha-audio" loop="" preload="none" src="./music.mp3"></audio>
<script id="bha-music-widget-js">

  a.playbackRate=1.25;
  function paint(){
    var on=!a.paused;
    wrap.dataset.state=on?'playing':'off';
    btn.setAttribute('aria-pressed',on?'true':'false');
    btn.setAttribute('aria-label',on?'暂停音乐':'播放音乐');
    btn.title=on?'暂停音乐':'播放音乐';
  }
  btn.addEventListener('click',function(){
    if(a.paused){a.play().then(paint).catch(paint);}else{a.pause();paint();}
  });
  a.addEventListener('play',paint);
  a.addEventListener('pause',paint);
  a.addEventListener('timeupdate',function(){
    if(a.duration)ring.style.setProperty('--p',(a.currentTime/a.duration*100).toFixed(1)+'%');
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden&&!a.paused){a.pause();}});

})();

<!-- bha-card-maker : 生成卡片（定制卡 / 奖章 / 自动） -->
<style id="bha-card-maker-css">
.bha-card-wrap{margin:18px 0 6px}
.bha-card-btn{background:#ff6841;color:#111;border:2px solid #111;border-radius:0;padding:13px 16px;
  font-weight:900;font-size:15px;letter-spacing:.4px;box-shadow:4px 4px #111;display:flex;align-items:center;
  gap:10px;justify-content:center;width:100%;cursor:pointer;font-family:inherit}
.bha-card-btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px #c5fa39}
.bha-card-btn:focus-visible{outline:3px solid #111;outline-offset:4px}
.bha-card-btn.ghost{background:#1d2319;color:#e8ead9;border-color:#6f7a58;box-shadow:3px 3px #0a0b08}
.bha-card-btn.ghost:hover{border-color:#c5fa39}
.bha-card-tip{font-size:11px;color:#6d795c;margin:6px 0 0;text-align:center}
</style>
<script id="bha-card-maker">
(function(){
  if (window.__BHA_CARD__) return;
  window.__BHA_CARD__ = true;

  // 谁有定制卡（我做好放仓库的）
  var CUSTOM = { '张博宇': './cards/zhangboyu.jpg' };

  var GREEN='#c5fa39', INK='#111210', ORANGE='#ff6841', PAPER='#f2f0e2', GOLD='#f6c453';

  function seeded(num){
    var h = 2166136261;
    for (var i=0;i<String(num).length;i++){ h ^= String(num).charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    var a = h >>> 0;
    return function(){
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function fakeStats(num){
    var r = seeded(num);
    var wild = r() > 0.88;
    var km = wild ? (18 + r() * 26) : (8.6 + r() * 4.0);
    var rating = 6.1 + r() * 3.2;
    return { km: km.toFixed(1), rating: rating.toFixed(1) };
  }
  function topGoals(){
    try{
      var el = document.getElementById('club-initial-data');
      if (!el) return Infinity;
      var data = JSON.parse(el.textContent), map = {};
      (data.matches || []).forEach(function(m){
        (m.entries || []).forEach(function(e){ map[e.id] = (map[e.id] || 0) + (e.goals || 0); });
      });
      var top = 0;
      Object.keys(map).forEach(function(k){ if (map[k] > top) top = map[k]; });
      return top || Infinity;
    } catch(e){ return Infinity; }
  }

  // 本周（数据里最新一次颁奖）的奖
  function weekAwards(){
    var el = document.getElementById('bha-honours-data');
    if (!el) return {};
    try{
      var data = JSON.parse(el.textContent), maxDate = '';
      data.forEach(function(w){ if (w.date > maxDate) maxDate = w.date; });
      var map = {};
      data.filter(function(w){ return w.date === maxDate; }).forEach(function(w){
        (w.awards || []).forEach(function(a){ a.week = w.week; map[a.player] = a; });
      });
      return map;
    } catch(e){ return {}; }
  }

  function download(url, name){
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function autoCard(p){
    var c = document.createElement('canvas');
    c.width = 1080; c.height = 1350;
    var img = document.querySelector('img.crest-mark') || document.querySelector('img[class*=crest]');
    var paint = function(){
      var x = c.getContext('2d'), W = 1080, H = 1350;
      var gold = p.goals > 0 && p.goals >= topGoals();
      var bg = gold ? GOLD : GREEN;
      x.fillStyle = bg; x.fillRect(0,0,W,H);
      x.strokeStyle = INK; x.lineWidth = 6; x.strokeRect(48,48,W-96,H-96);
      if (img && img.complete) x.drawImage(img, 80, 80, 86, 94);
      x.fillStyle = INK;
      x.font = '900 32px "Arial Black", Arial, sans-serif'; x.fillText('BOHAI BAY', 186, 122);
      x.font = '700 20px "Microsoft YaHei", "PingFang SC", sans-serif'; x.fillText('渤海湾竞技 · 2026', 186, 156);
      if (gold){
        x.fillStyle = INK; x.fillRect(W-472,106,352,62);
        x.fillStyle = GOLD; x.font = '900 26px "Arial Black", Arial, sans-serif';
        x.fillText('★ 金靴 GOLDEN BOOT', W-454, 148);
      }
      var fs = 128;
      x.font = '900 ' + fs + 'px "Microsoft YaHei", "PingFang SC", "Arial Black", sans-serif';
      while (x.measureText(p.name).width > W - 170 && fs > 58) {
        fs -= 6;
        x.font = '900 ' + fs + 'px "Microsoft YaHei", "PingFang SC", "Arial Black", sans-serif';
      }
      x.fillText(p.name, 80, 400);
      x.font = '900 50px "Arial Black", Arial, sans-serif'; x.fillText('#'+p.num, 84, 472);
      var w = x.measureText('#'+p.num).width;
      x.font = '700 26px "Microsoft YaHei", "PingFang SC", sans-serif';
      x.fillText(p.pos + ' · ' + p.team, 84+w+20, 469);
      x.fillStyle = INK; x.fillRect(80,510,W-160,78);
      x.fillStyle = bg; x.font = '700 24px "Microsoft YaHei", "PingFang SC", sans-serif';
      x.fillText((p.bio || '').slice(0,30), 102, 558);

      var f = fakeStats(p.num);
      var gpm = p.played ? (p.goals / p.played).toFixed(1) : '—';
      var stats = [['出场', String(p.played)], ['进球', String(p.goals)], ['场均进球', gpm],
                   ['场均跑动', f.km + ' km'], ['场均评分', f.rating], ['胜场', String(p.wins)]];
      var cols = 3, gap = 16, bx = 80, by = 630, bw = (W-160-gap*(cols-1))/cols, bh = 208;
      stats.forEach(function(s, i){
        var rw = Math.floor(i/cols), ci = i%cols;
        var px = bx + ci*(bw+gap), py = by + rw*(bh+gap), hi = (i===1);
        x.fillStyle = hi ? INK : PAPER; x.strokeStyle = INK; x.lineWidth = 5;
        x.fillRect(px,py,bw,bh); x.strokeRect(px,py,bw,bh);
        x.fillStyle = hi ? (gold ? GOLD : GREEN) : INK;
        x.textAlign = 'center';
        var t = String(s[1]);
        x.font = t.length > 5 ? '900 54px "Arial Black", Arial, sans-serif' : '900 84px "Arial Black", Arial, sans-serif';
        x.fillText(t, px+bw/2, py+128);
        x.font = '700 22px "Microsoft YaHei", "PingFang SC", sans-serif';
        x.fillText(s[0], px+bw/2, py+178);
        x.textAlign = 'left';
      });
      x.fillStyle = INK; x.fillRect(0,H-210,W,210);
      x.fillStyle = gold ? GOLD : GREEN;
      x.font = '900 78px "Microsoft YaHei", "PingFang SC", "Arial Black", sans-serif';
      x.fillText('不是第一 就是差', 76, H-108);
      x.fillStyle = PAPER; x.font = '700 20px "Arial Black", Arial, sans-serif';
      x.fillText('BAD TOUCH. GOOD TIMES.', 80, H-58);
      x.textAlign = 'right'; x.fillStyle = ORANGE; x.font = '900 26px "Arial Black", Arial, sans-serif';
      x.fillText('BHA', W-80, H-58);
      c.toBlob(function(blob){
        download(URL.createObjectURL(blob), '渤海湾竞技_' + p.name + '.png');
      }, 'image/png');
    };
    if (img && !img.complete) { img.onload = paint; setTimeout(paint, 900); } else paint();
  }

  function medalCard(p, award){
    var c = document.createElement('canvas');
    c.width = 600; c.height = 600;
    var x = c.getContext('2d');
    var bg = award.name.indexOf('金靴') >= 0 ? GOLD
           : award.name.indexOf('助攻') >= 0 ? GREEN : ORANGE;
    x.fillStyle = bg; x.fillRect(0,0,600,600);
    x.strokeStyle = INK; x.lineWidth = 8; x.strokeRect(22,22,556,556);
    x.fillStyle = INK;
    x.font = '700 22px "Microsoft YaHei", "PingFang SC", sans-serif';
    x.fillText('BOHAI BAY · 第 ' + (award.week || 2) + ' 周', 52, 78);
    var fs = 96;
    x.font = '900 ' + fs + 'px "Microsoft YaHei", "PingFang SC", "Arial Black", sans-serif';
    while (x.measureText(award.name).width > 470 && fs > 46) {
      fs -= 6;
      x.font = '900 ' + fs + 'px "Microsoft YaHei", "PingFang SC", "Arial Black", sans-serif';
    }
    x.fillText(award.name, 52, 232);
    x.font = '900 24px "Arial Black", Arial, sans-serif';
    x.fillText(award.en || '', 54, 272);
    x.fillStyle = INK; x.fillRect(52, 330, 496, 4);
    x.font = '900 74px "Microsoft YaHei", "PingFang SC", sans-serif';
    x.fillText(p.name, 52, 452);
    x.font = '900 30px "Arial Black", Arial, sans-serif';
    x.fillText('#' + p.num, 54, 500);
    x.font = '900 22px "Microsoft YaHei", sans-serif';
    x.fillText('★ WINNER · ' + p.team, 52, 548);
    c.toBlob(function(blob){
      download(URL.createObjectURL(blob), '渤海湾竞技_' + award.name + '_' + p.name + '.png');
    }, 'image/png');
  }

  function readProfile(){
    var modal = document.querySelector('.overlay .modal');
    if (!modal || !modal.querySelector('.profile-stats')) return null;
    var eyebrow = (modal.querySelector('.eyebrow') || {}).textContent || '';
    var m = eyebrow.match(/#\s*([^\s]+)/);
    var raw = (modal.querySelector('h2') || {}).textContent || '';
    var name = raw.replace(/[（(][^）)]*[）)]/g, '').trim() || raw.trim();
    var ps = modal.querySelectorAll('p');
    var posLine = (ps[0] && ps[0].textContent) || '';
    var boxes = modal.querySelectorAll('.profile-stats > div');
    var val = function(i){ return boxes[i] && boxes[i].querySelector('b') ? boxes[i].querySelector('b').textContent : '0'; };
    return {
      name: name, num: m ? m[1] : '0',
      team: (eyebrow.split('·')[0] || '').trim(),
      pos: posLine.split('·')[0].trim(),
      bio: ((ps[1] && ps[1].textContent) || '').trim(),
      played: parseInt(val(0), 10) || 0,
      goals: parseInt(val(1), 10) || 0,
      wins: parseInt(val(3), 10) || 0,
    };
  }

  function inject(){
    var modal = document.querySelector('.overlay .modal');
    if (!modal || !modal.querySelector('.profile-stats') || modal.querySelector('.bha-card-wrap')) return;
    var p = readProfile();
    if (!p) return;

    var wrap = document.createElement('div');
    wrap.className = 'bha-card-wrap';

    var custom = CUSTOM[p.name];
    var award = weekAwards()[p.name];

    // 只有确实有，才出现；没有就不出现
    if (custom){
      var b1 = document.createElement('button');
      b1.type = 'button'; b1.className = 'bha-card-btn';
      b1.textContent = '我的定制卡 · 保存到相册';
      b1.addEventListener('click', function(){
        download(custom, '渤海湾竞技_' + p.name + '_定制卡.jpg');
      });
      wrap.appendChild(b1);
    }
    if (award){
      var b2 = document.createElement('button');
      b2.type = 'button'; b2.className = 'bha-card-btn ghost';
      b2.style.marginTop = '10px';
      b2.textContent = '本周奖章 · ' + award.name;
      b2.addEventListener('click', function(){ medalCard(p, award); });
      wrap.appendChild(b2);
    }
    var b3 = document.createElement('button');
    b3.type = 'button';
    b3.className = custom || award ? 'bha-card-btn ghost' : 'bha-card-btn';
    if (custom || award) b3.style.marginTop = '10px';
    b3.textContent = (custom || award) ? '自动生成的数据卡' : '生成卡片 · 保存到相册';
    b3.addEventListener('click', function(){ autoCard(p); });
    wrap.appendChild(b3);

    var tip = document.createElement('p');
    tip.className = 'bha-card-tip';
    tip.textContent = '1080×1350，发朋友圈正好';
    wrap.appendChild(tip);

    var stats = modal.querySelector('.profile-stats');
    stats.insertAdjacentElement('afterend', wrap);
  }

  new MutationObserver(inject).observe(document.body, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', inject);
  setInterval(inject, 800);
})();
</script>

@media (max-width:720px){
  #bha-mail{left:12px;bottom:16px;padding:10px;gap:0;font-size:0}
  #bha-mail .badge{position:absolute;top:-8px;right:-8px;font-size:10px}
  #bha-mail .ico{width:20px;height:14px}
  .bha-box{left:12px;right:12px;width:auto;bottom:70px}
  .bha-tl-wrap{height:auto;max-height:none;overflow:visible;border:0;background:none;mask-image:none;-webkit-mask-image:none;padding-left:2px}
  .bha-rail{height:auto}
  .bha-axis{left:20px;right:auto;top:0;bottom:0;width:2px;height:auto;background:linear-gradient(180deg,#2f3722,#c5fa39 10%,#c5fa39 60%,#f6c453 82%,#3a2f10)}
  .bha-day{position:relative!important;left:0!important;width:auto;height:auto;padding:0 0 18px 42px}
  .bha-day .tick{left:20px;top:12px;width:12px;height:1px}
  .bha-day .node{left:16px;top:8px}
  .bha-day .dlabel{position:static;transform:none;margin:0 0 8px;padding:0}
  .bha-cards{position:static;width:auto;margin:0}
  .bha-cards.up,.bha-cards.down{top:auto;bottom:auto}
  .bha-future{position:relative;top:auto;height:90px;margin-left:20px}
}

<script id="bha-honours-data" type="application/json">[{"date":"2026-11-09","week":1,"awards":[{"name":"金靴","en":"GOLDEN BOOT","player":"张博宇","num":"21","team":"三班"}]},{"date":"2026-11-16","week":2,"awards":[{"name":"金靴","en":"GOLDEN BOOT","player":"张博宇","num":"21","team":"三班"},{"name":"助攻王","en":"ASSIST KING","player":"王鹏然","num":"1","team":"三班"}]}]</script>
<script id="bha-honours-js">
(function(){
  if (window.__BHA_TL__) return;
  window.__BHA_TL__ = true;
  var S = { tab: 'ranks', cls: '三班' };
  var LSKEY = 'bha-local-events-v1';
  var WD = ['周日','周一','周二','周三','周四','周五','周六'];
  var AWARD_WORDS = { '金靴': 1, '助攻王': 1 };

  function loadData(){ try { return JSON.parse(document.getElementById('club-initial-data').textContent); } catch(e){ return { players: [], matches: [] }; } }
  function localEvents(){ try { return JSON.parse(localStorage.getItem(LSKEY) || '[]'); } catch(e){ return []; } }
  function saveLocal(l){ try { localStorage.setItem(LSKEY, JSON.stringify(l)); } catch(e){} }
  function dayLabel(d){ return WD[new Date(d + 'T00:00:00+08:00').getDay()]; }
  function isMobile(){ return window.matchMedia('(max-width:720px)').matches; }

  function collect(){
    var items = [];
    try {
      JSON.parse(document.getElementById('bha-honours-data').textContent).forEach(function(w){
        (w.awards || []).forEach(function(a){
          if (a.team !== S.cls) return;
          items.push({ date: w.date, kind: 'AWARD', award: true, title: a.name + ' · ' + a.player,
            body: '第 ' + (w.week || '') + ' 周 · #' + a.num + ' · ' + a.en, local: false });
        });
      });
    } catch(e){}
    var data = loadData();
    (data.matches || []).forEach(function(m){
      var t = m.type || '德比';
      if (S.cls === '三班' ? (t !== '崔强杯' && t !== '德比') : t !== '二班') return;
      items.push({ date: m.date, kind: 'MATCH', award: false,
        title: (m.teamA || 'A队') + ' ' + ((m.a || 0) + (m.bonusA || 0)) + ':' + ((m.b || 0) + (m.bonusB || 0)) + ' ' + (m.teamB || 'B队'),
        body: t + ' · ' + (m.court || '小场') + (m.note ? ' · ' + m.note : ''), local: false });
    });
    localEvents().forEach(function(e){
      if (e.cls && e.cls !== S.cls) return;
      items.push({ date: e.date, kind: 'NEWS', award: false, title: e.title, body: e.body || '', local: true });
    });
    items.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
    return items;
  }

  function buildTimeline(){
    var outer = document.createElement('div'); outer.className = 'bha-tl-outer';
    var wrap = document.createElement('div'); wrap.className = 'bha-tl-wrap';
    var rail = document.createElement('div'); rail.className = 'bha-rail';
    wrap.appendChild(rail); outer.appendChild(wrap);
    var items = collect();
    if (!items.length){
      rail.innerHTML = '<div class="bha-hon-empty"><b>NOTHING HERE YET.</b>还没有任何记录。</div>';
      return outer || wrap;
    }
    var days = {};
    items.forEach(function(it){ (days[it.date] = days[it.date] || []).push(it); });
    var dates = Object.keys(days).sort();
    var GAP = 300, PADL = 210, PADR = 620;
    if (!isMobile()){
      rail.style.width = (PADL + (dates.length - 1) * GAP + PADR) + 'px';
      var axis = document.createElement('div'); axis.className = 'bha-axis'; rail.appendChild(axis);
      var head = document.createElement('div');
      head.style.cssText = 'position:absolute;left:34px;top:28px;right:0;display:flex;align-items:baseline;gap:14px';
      head.innerHTML = '<span style="font-family:"Arial Black",Arial,sans-serif;font-style:italic;font-size:15px;color:#e8ead9;letter-spacing:-.5px">渤海湾竞技 · 编年</span>' +
        '<span style="flex:1;height:1px;background:linear-gradient(90deg,#4a5438,transparent)"></span>' +
        '<span style="font-family:Consolas,monospace;font-size:10px;letter-spacing:2px;color:#7f8b6c;padding-right:34px">2026 秋 · 从 10.29 开始</span>';
      outer.appendChild(head);
      var cap = document.createElement('div');
      cap.style.cssText = 'position:absolute;left:62px;top:170px;display:flex;flex-direction:column;align-items:center;transform:translateY(-1px)';
      cap.innerHTML = '<div style="width:9px;height:9px;border:2px solid #c5fa39;background:#14170f;transform:rotate(45deg);margin-bottom:10px"></div>' +
        '<div style="position:absolute;top:-30px;left:6px;white-space:nowrap;font-family:Consolas,monospace;font-size:10px;letter-spacing:1px;color:#8e9a78">起点 · 10.29 10:45</div>';
      rail.appendChild(cap);
    }
    dates.forEach(function(d, i){
      var col = document.createElement('div');
      col.className = 'bha-day';
      if (!isMobile()) col.style.left = (PADL + i * GAP) + 'px';
      var tick = document.createElement('div'); tick.className = 'tick';
      var node = document.createElement('button');
      node.type = 'button'; node.className = 'node';
      node.setAttribute('aria-label', '给 ' + d + ' 添加一件事');
      node.addEventListener('click', function(){ openEditor(d); });
      var lab = document.createElement('div'); lab.className = 'dlabel';
      lab.innerHTML = '<b>' + d.slice(5).replace('-', '.') + '</b> ' + dayLabel(d) + ' <span style="color:#c5fa39">+</span>';
      lab.addEventListener('click', function(){ openEditor(d); });
      col.appendChild(tick); col.appendChild(node); col.appendChild(lab);

      var hasAward = days[d].some(function(x){ return x.award; });
      var cards = document.createElement('div');
      cards.className = 'bha-cards down';
      days[d].forEach(function(it, k){
        var p = document.createElement('article');
        p.className = 'bha-paper ' + (k % 2 ? 'a2' : (k ? 'a1' : ''));
        p.innerHTML = '<div class="p-kicker">' + it.kind + ' · ' + d.replace(/-/g, '.') + '</div>' +
          '<h4>' + it.title + '</h4><p>' + (it.body || '') + '</p>' +
          (it.local ? '<span class="p-local">本人所记</span>' : '');
        cards.appendChild(p);
      });
      col.appendChild(cards);
      rail.appendChild(col);
    });

    // 结尾：金色发散
    var fut = document.createElement('div'); fut.className = 'bha-future';
    fut.style.left = (isMobile() ? 0 : (PADL + (dates.length - 1) * GAP + 330)) + 'px';
    var word = document.createElement('div'); word.className = 'word'; word.textContent = '未完待续 ——';
    fut.appendChild(word);
    var seed = 11;
    function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    var beam = document.createElement('div');
    beam.style.cssText = 'position:absolute;left:0;top:-1px;width:230px;height:2px;background:linear-gradient(90deg,#c5fa39,transparent)';
    fut.appendChild(beam);
    for (var k = 0; k < 150; k++){
      var t = rnd();
      var dot = document.createElement('i'); dot.className = 'dot';
      var r = (1.6 + rnd() * 4.2) * (1 - t * 0.55);
      dot.style.left = (t * 240) + 'px';
      dot.style.top = (Math.sin(t * 2.6) * 46 * (0.45 + rnd()) + (rnd() - 0.5) * 18) + 'px';
      dot.style.width = r + 'px'; dot.style.height = r + 'px';
      dot.style.opacity = (0.95 - t * 0.9).toFixed(2);
      dot.style.background = rnd() > 0.3 ? '#f6c453' : '#c5fa39';
      fut.appendChild(dot);
    }
    rail.appendChild(fut);
    return outer;
  }

  function openBox(){
    var box = document.getElementById('bha-box-box');
    if (!box){ box = document.createElement('div'); box.id = 'bha-box-box'; box.className = 'bha-box'; document.body.appendChild(box); }
    var items = collect().slice().reverse();
    box.innerHTML = '<header><span>时间轴来信</span><button type="button" aria-label="关闭">×</button></header>' +
      '<div class="tools"><button type="button" id="bha-box-write" class="primary">写一条</button>' +
      '<button type="button" id="bha-box-export">导出我写的</button></div>' +
      (items.length ? items.map(function(it){
        return '<div class="item"><b>' + it.title + '</b><span>' + it.date + ' · ' + dayLabel(it.date) + ' · ' + it.kind + '</span>' +
          (it.body ? '<p>' + it.body + '</p>' : '') + '</div>';
      }).join('') : '<div class="empty">信箱是空的。点时间轴上的方块写第一条。</div>');
    box.classList.add('on');
    box.querySelector('header button').addEventListener('click', function(){ box.classList.remove('on'); });
    box.querySelector('#bha-box-export').addEventListener('click', exportLocal);
    box.querySelector('#bha-box-write').addEventListener('click', function(){
      box.classList.remove('on');
      openEditor(new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10));
    });
  }

  function openEditor(date){
    var old = document.querySelector('.bha-edit'); if (old) old.remove();
    var wrap = document.createElement('div'); wrap.className = 'bha-edit';
    wrap.innerHTML =
      '<div class="card" role="dialog" aria-modal="true" aria-labelledby="bha-e-h"><h3 id="bha-e-h">在时间轴上写一笔</h3>' +
      '<div class="date">' + date + ' · ' + dayLabel(date) + '</div>' +
      '<label for="bha-e-title">标题</label><input id="bha-e-title" maxlength="40" placeholder="例：周三加练，大雨里跑完 5 公里">' +
      '<label for="bha-e-body">正文（可空）</label><textarea id="bha-e-body" maxlength="120" placeholder="补一句细节，像报纸的副稿"></textarea>' +
      '<div class="row"><button type="button" class="ghost" id="bha-e-cancel">取消</button>' +
      '<button type="button" id="bha-e-save">收进这一天的抽屉</button></div>' +
      '<div class="hint">先存在你这台设备上，别人看不到。要发给全班：存完点左下角信箱 →「导出我写的」，把文件发我，我发到线上。</div></div>';
    document.body.appendChild(wrap);
    var input = wrap.querySelector('#bha-e-title');
    setTimeout(function(){ input.focus(); }, 30);
    wrap.addEventListener('click', function(e){ if (e.target === wrap) wrap.remove(); });
    wrap.addEventListener('keydown', function(e){ if (e.key === 'Escape') wrap.remove(); });
    wrap.querySelector('#bha-e-cancel').addEventListener('click', function(){ wrap.remove(); });
    wrap.querySelector('#bha-e-save').addEventListener('click', function(){
      var title = input.value.trim();
      if (!title){ input.focus(); return; }
      var list = localEvents();
      list.push({ date: date, title: title, body: wrap.querySelector('#bha-e-body').value.trim(), cls: S.cls });
      saveLocal(list); wrap.remove(); repaint();
    });
  }

  function exportLocal(){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(localEvents(), null, 2)], { type: 'application/json' }));
    a.download = '渤海湾竞技_时间轴事件.json';
    document.body.appendChild(a); a.click(); a.remove();
  }

  function render(){
    var grid = document.querySelector('.rank-grid');
    if (!grid){
      document.querySelectorAll('.bha-hon-bar,.bha-tl-wrap,.bha-tl-outer,.bha-hon-empty-cls').forEach(function(n){ n.remove(); });
      var mb = document.getElementById('bha-mail'); if (mb) mb.remove();
      var bx = document.getElementById('bha-box-box'); if (bx) bx.remove();
      return;
    }
    var filters = document.querySelector('.rank-filters');
    if (!document.querySelector('.bha-hon-bar')){
      var bar = document.createElement('div');
      bar.className = 'bha-hon-bar';
      bar.innerHTML = '<div class="bha-hon-group" role="group" aria-label="板块">' +
          '<button type="button" data-tab="ranks">排行榜</button><button type="button" data-tab="honours">荣誉室</button></div>' +
        '<div class="bha-hon-group" role="group" aria-label="班级">' +
          '<button type="button" data-cls="二班">二班</button><button type="button" data-cls="三班">三班</button></div>';
      (filters || grid).parentNode.insertBefore(bar, filters || grid);
      bar.addEventListener('click', function(e){
        var t = e.target.closest('button'); if (!t) return;
        if (t.dataset.tab) S.tab = t.dataset.tab;
        if (t.dataset.cls) S.cls = t.dataset.cls;
        repaint();
      });
    }
    if (!document.getElementById('bha-mail')){
      var mail = document.createElement('button');
      mail.id = 'bha-mail'; mail.type = 'button';
      mail.innerHTML = '<span class="ico" aria-hidden="true"></span>时间轴来信 <span class="badge">' + collect().length + '</span>';
      mail.addEventListener('click', openBox);
      document.body.appendChild(mail);
    }
    repaint();
  }

  function repaint(){
    var bar = document.querySelector('.bha-hon-bar'); if (!bar) return;
    bar.querySelectorAll('[data-tab]').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === S.tab); });
    bar.querySelectorAll('[data-cls]').forEach(function(b){ b.classList.toggle('on', b.dataset.cls === S.cls); });
    var grid = document.querySelector('.rank-grid');
    var filters = document.querySelector('.rank-filters');
    var tl = document.querySelector('.bha-tl-outer');
    if (S.tab === 'honours'){
      if (grid) grid.style.display = 'none';
      if (filters) filters.style.display = 'none';
      var sig = S.cls + ':' + collect().length + ':' + (isMobile() ? 'm' : 'd');
      if (tl && tl.dataset.sig !== sig){ tl.remove(); tl = null; }
      if (!tl){
        tl = buildTimeline(); tl.dataset.sig = sig;
        (grid || filters || bar).parentNode.insertBefore(tl, (grid || filters || bar));
      }
      tl.style.display = '';
    } else {
      if (tl) tl.style.display = 'none';
      if (filters) filters.style.display = '';
      if (grid){
        if (S.cls === '二班'){
          grid.style.display = 'none';
          var note = document.querySelector('.bha-hon-empty-cls');
          if (!note){
            note = document.createElement('div');
            note.className = 'bha-hon-empty bha-hon-empty-cls';
            note.innerHTML = '<b>二班榜</b>名单已录入 18 人，比赛记录会自己排进来。';
            grid.parentNode.insertBefore(note, grid);
          }
          note.style.display = '';
        } else {
          grid.style.display = '';
          var n2 = document.querySelector('.bha-hon-empty-cls'); if (n2) n2.style.display = 'none';
        }
      }
    }
  }

  new MutationObserver(function(){ render(); }).observe(document.body, { childList: true, subtree: true });
  setInterval(render, 900);
})();
</script>
